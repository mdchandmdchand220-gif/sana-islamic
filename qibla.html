<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sana Islamic - Qibla Finder</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#071b52;
    color:white;
    text-align:center;
}

.header{
    height:65px;
    background:#4055b8;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.header h2{
    margin:0;
    font-size:25px;
}

.menu{
    font-size:30px;
}

.main{
    min-height:calc(100vh - 65px);
    padding:20px 12px 40px;
    background:
    radial-gradient(circle at 50% 35%,
    #1688d8 0%,
    #123c9c 35%,
    #071b52 90%);
}

h1{
    font-size:30px;
    margin:10px 0;
}

.info{
    font-size:16px;
    margin:8px auto 15px;
    max-width:400px;
}

button{
    border:0;
    border-radius:8px;
    padding:14px 25px;
    margin:6px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#startBtn{
    background:white;
    color:#222;
}

#calibrateBtn{
    background:#159ddc;
    color:white;
    display:none;
}

/* MAIN QIBLA VIEW */

.qiblaView{
    position:relative;
    width:100%;
    max-width:430px;
    height:520px;
    margin:20px auto;
    overflow:hidden;
    border-radius:20px;
    background:
    linear-gradient(
        to bottom,
        #0b438f 0%,
        #126fc0 55%,
        #071a4d 56%,
        #06133c 100%
    );
    box-shadow:0 0 25px rgba(0,0,0,.5);
}

/* STARS */

.stars{
    position:absolute;
    top:25px;
    width:100%;
    font-size:25px;
    opacity:.8;
}

/* QIBLA LINE */

.qiblaLine{
    position:absolute;
    width:55px;
    height:430px;
    left:50%;
    bottom:-230px;
    transform:
    translateX(-50%)
    rotate(0deg);

    transform-origin:
    50% 100%;

    background:
    linear-gradient(
        to right,
        #087bb8,
        #28c6ef,
        #087bb8
    );

    clip-path:polygon(
        40% 100%,
        60% 100%,
        60% 25%,
        100% 25%,
        50% 0%,
        0% 25%,
        40% 25%
    );

    transition:
    transform .2s linear;

    z-index:2;
}

/* KAABA MARKER */

.kaabaMarker{
    position:absolute;
    top:65px;
    left:50%;
    transform:translateX(-50%);
    width:170px;
    height:170px;
    border-radius:50%;
    background:#182878;
    border:4px solid rgba(255,255,255,.45);
    box-shadow:
    0 0 25px rgba(0,0,0,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
}

.kaabaCircle{
    width:125px;
    height:125px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.4);
    display:flex;
    align-items:center;
    justify-content:center;
}

.kaaba{
    font-size:68px;
}

/* COMPASS CIRCLE */

.compassCircle{
    position:absolute;
    width:220px;
    height:220px;
    left:50%;
    top:220px;
    transform:translateX(-50%);
    border:5px solid white;
    border-radius:50%;
    z-index:6;
    pointer-events:none;
}

.compassCircle:before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:18px;
    height:18px;
    background:#21b8e9;
    border-radius:50%;
    transform:translate(-50%,-50%);
}

/* DISTANCE */

.distanceBox{
    position:absolute;
    top:340px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    color:#222;
    padding:12px 22px;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    z-index:10;
}

.distanceBox:after{
    content:"";
    position:absolute;
    bottom:-12px;
    left:50%;
    transform:translateX(-50%);
    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-top:12px solid white;
}

/* INFO */

#degree{
    font-size:20px;
    margin:10px;
}

#location{
    font-size:15px;
    margin:8px;
}

.status{
    background:rgba(0,0,0,.35);
    padding:12px;
    border-radius:10px;
    max-width:450px;
    margin:10px auto;
}

#result{
    font-size:17px;
    font-weight:bold;
    margin:10px;
}

.warning{
    font-size:13px;
    color:#ffe082;
    max-width:450px;
    margin:10px auto;
}

</style>
</head>

<body>

<div class="header">

<h2>qibla</h2>

<div class="menu">⋮</div>

</div>


<div class="main">

<h1>🕋 Qibla Finder</h1>

<div class="info">
मोबाइल को धीरे-धीरे घुमाएँ और Kaaba शरीफ की दिशा खोजें।
</div>


<button id="startBtn"
onclick="startQibla()">

📍 Find Qibla

</button>


<button id="calibrateBtn"
onclick="calibrateCompass()">

🧭 Calibrate Compass

</button>


<div class="qiblaView">

<div class="stars">
✦　✧　✦　⋆　✧　✦
</div>


<!-- QIBLA DIRECTION -->

<div id="qiblaLine"
class="qiblaLine">
</div>


<!-- KAABA -->

<div class="kaabaMarker">

<div class="kaabaCircle">

<div class="kaaba">
🕋
</div>

</div>

</div>


<!-- COMPASS -->

<div class="compassCircle">
</div>


<!-- DISTANCE -->

<div class="distanceBox">

<span id="distance">
-- km
</span>

</div>


</div>


<div id="degree">

🕋 Qibla Direction: --

</div>


<div id="location">

📍 Location: --

</div>


<div id="status"
class="status">

Find Qibla दबाएँ।

</div>


<div id="result">
</div>


<div class="warning">

⚠️ Compass सही काम करने के लिए आपके मोबाइल में Magnetometer/Compass Sensor होना जरूरी है।

</div>

</div>


<script>

/* ==========================
VARIABLES
========================== */

let qiblaBearing = 0;

let compassStarted = false;

let lastRotation = 0;


/* ==========================
START QIBLA
========================== */

async function startQibla(){

document.getElementById("status").innerHTML =
"📍 Location खोजी जा रही है...";


if(!navigator.geolocation){

alert("आपके Browser में GPS Support नहीं है।");

return;

}


navigator.geolocation.getCurrentPosition(

async function(position){

let lat =
position.coords.latitude;

let lon =
position.coords.longitude;


/* LOCATION */

document.getElementById("location").innerHTML =

"📍 Location: " +

lat.toFixed(4) +

", " +

lon.toFixed(4);


/* QIBLA */

qiblaBearing =
calculateQibla(lat,lon);


document.getElementById("degree").innerHTML =

"🕋 Qibla Direction: " +

qiblaBearing.toFixed(1) +

"°";


/* DISTANCE */

let distance =
calculateDistance(

lat,
lon,
21.4225,
39.8262

);


document.getElementById("distance").innerHTML =

distance.toFixed(0) +

" km";


document.getElementById("result").innerHTML =

"🕋 अब मोबाइल को धीरे-धीरे घुमाएँ।";


await enableCompass();

},

function(){

document.getElementById("status").innerHTML =

"❌ Location Permission Allow करें।";

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


/* ==========================
QIBLA CALCULATION
========================== */

function calculateQibla(lat,lon){

let kaabaLat =
21.4225;

let kaabaLon =
39.8262;


let lat1 =
lat * Math.PI / 180;

let lat2 =
kaabaLat * Math.PI / 180;

let dLon =
(kaabaLon-lon) *
Math.PI / 180;


let y =
Math.sin(dLon);


let x =

Math.cos(lat1) *
Math.tan(lat2)

-

Math.sin(lat1) *
Math.cos(dLon);


let bearing =

Math.atan2(y,x) *
180 / Math.PI;


return (bearing+360)%360;

}


/* ==========================
DISTANCE
========================== */

function calculateDistance(

lat1,
lon1,
lat2,
lon2

){

let R = 6371;


let dLat =
(lat2-lat1) *
Math.PI / 180;

let dLon =
(lon2-lon1) *
Math.PI / 180;


let a =

Math.sin(dLat/2) *
Math.sin(dLat/2)

+

Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2) *
Math.sin(dLon/2);


let c =

2 *
Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);


return R*c;

}


/* ==========================
COMPASS
========================== */

async function enableCompass(){

if(compassStarted){

return;

}


/* iPhone */

if(

typeof DeviceOrientationEvent !==
"undefined"

&&

typeof DeviceOrientationEvent.requestPermission ===
"function"

){

try{

let permission =

await DeviceOrientationEvent.requestPermission();


if(permission !== "granted"){

document.getElementById("status").innerHTML =

"❌ Compass Permission Allow नहीं हुई।";

return;

}

}

catch(e){

return;

}

}


/* SENSOR */

if(typeof DeviceOrientationEvent !==
"undefined"){

window.addEventListener(

"deviceorientationabsolute",

handleOrientation,

true

);


window.addEventListener(

"deviceorientation",

handleOrientation,

true

);


compassStarted = true;


document.getElementById(
"calibrateBtn"
).style.display =

"inline-block";


document.getElementById("status").innerHTML =

"🧭 Compass चालू है। मोबाइल घुमाएँ।";

}

else{

document.getElementById("status").innerHTML =

"❌ Compass Support नहीं है।";

}

}


/* ==========================
HANDLE ORIENTATION
========================== */

function handleOrientation(event){

let heading = null;


/* iPhone */

if(

event.webkitCompassHeading !==
undefined

){

heading =
event.webkitCompassHeading;

}


/* Android */

else if(

event.absolute === true
&&
event.alpha !== null

){

heading =
360-event.alpha;

}


/* FALLBACK */

else if(event.alpha !== null){

heading =
360-event.alpha;

}


if(heading === null){

return;

}


heading =
(heading+360)%360;


/* QIBLA ROTATION */

let rotation =

qiblaBearing-heading;


/* NORMALIZE */

while(rotation > 180){

rotation -= 360;

}

while(rotation < -180){

rotation += 360;

}


/* SMOOTH */

let difference =
rotation-lastRotation;


while(difference > 180){

difference -= 360;

}

while(difference < -180){

difference += 360;

}


lastRotation +=
difference*0.25;


/* MOVE QIBLA LINE */

document.getElementById(
"qiblaLine"
).style.transform =

"translateX(-50%) rotate(" +

lastRotation +

"deg)";


document.getElementById("status").innerHTML =

"🧭 Compass: " +

heading.toFixed(0) +

"°";

}


/* ==========================
CALIBRATION
========================== */

function calibrateCompass(){

document.getElementById("status").innerHTML =

"🔄 मोबाइल को धीरे-धीरे 8 के आकार में घुमाकर Compass Calibrate करें।";


setTimeout(function(){

document.getElementById("status").innerHTML =

"✅ Calibration पूरी हो गई। अब Qibla की दिशा देखें।";

},5000);

}

</script>

</body>
</html>
