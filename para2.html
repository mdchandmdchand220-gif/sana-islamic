<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>पारा 2 - سيقول السفهاء</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#eaf7ef;
line-height:1.8;
}

.banner{
width:100%;
max-width:1000px;
margin:20px auto;
border-radius:20px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.banner img{
width:100%;
display:block;
}

.heading{
background:#0b6b3a;
color:white;
text-align:center;
padding:20px;
}

.heading h1{
font-size:34px;
}

.heading h2{
font-size:28px;
color:#ffe600;
}

.heading h3{
font-size:25px;
}

.heading p{
font-size:22px;
}

.credit{
background:#f5d142;
color:#000;
text-align:center;
padding:15px;
font-size:20px;
font-weight:bold;
}

.ayah{
background:white;
margin:18px;
padding:18px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.number{
font-size:22px;
font-weight:bold;
color:#0b6b3a;
}

.arabic{
font-size:32px;
direction:rtl;
text-align:right;
line-height:2;
margin:10px 0;
}

.hindi{
font-size:20px;
color:#b00020;
}

@media(max-width:768px){

.arabic{
font-size:27px;
}

.hindi{
font-size:18px;
}

}
</style>

</head>

<body>

<div class="banner">
<img src="image/imagespara2-banner.jpg" alt="Para 2 Banner">
</div>


<div class="heading">

<h1>पारा 2</h1>

<h2>الجزء الثاني</h2>

<h3>پارہ 2</h3>

<p>Para 2</p>

</div>


<div class="credit">

सना इस्लामिक<br>
سنا الإسلامية<br>
سنا اسلامک<br>
SANAISLAMIC

</div>


<div id="content">

<h2 style="text-align:center;color:#0b6b3a;">
📖 सूरह अल-बक़रह लोड हो रही है...
</h2>

</div>
<script>

Promise.all([

fetch("https://api.alquran.cloud/v1/surah/2/quran-simple")
.then(r=>r.json()),

fetch("https://api.alquran.cloud/v1/surah/2/hi.farooq")
.then(r=>r.json())

])

.then(([arabic,hindi])=>{

let html="";

let ar=arabic.data.ayahs;

let hi=hindi.data.ayahs;


// पारा 2 = सूरह अल-बक़रह आयत 142 से 252 तक

for(let i=141;i<252;i++){

html += `

<div class="ayah">

<div class="number">

सूरह अल-बक़रह - आयत ${i+1}

</div>


<div class="arabic">

${ar[i].text}

</div>


<div class="hindi">

${hi[i].text}

</div>


</div>

`;

}


document.getElementById("content").innerHTML=html;


})

.catch(error=>{

document.getElementById("content").innerHTML=

"<h2 style='color:red;text-align:center;'>डेटा लोड नहीं हो सका।</h2>";

console.error(error);

});

</script>


</body>

</html>
